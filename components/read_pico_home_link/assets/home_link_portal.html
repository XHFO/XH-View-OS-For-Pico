<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>连接填写</title><style>body{font:16px/1.4 sans-serif;margin:12px;max-width:28em}label{display:block;margin-top:8px}input,button{width:100%;box-sizing:border-box;font:inherit;padding:8px;margin-top:4px}input[type=checkbox]{width:auto}button{margin-top:12px}p,small{color:#333}</style></head><body><h1 id='title'>家庭连接</h1><p>请连到阅读器所在的 Wi-Fi。酒店或开启客户端隔离的热点下，手机可能打不开此页。</p><p id='s'>正在读取…</p><section id='home'><label>本地地址<input id='local' autocomplete='off'></label><button id='discover' type='button'>搜索局域网 Home Assistant</button><p id='discoveryStatus' role='status'></p><div id='discoveryResults'></div><small>选择结果后再保存。没有结果时，可直接填写 HA 的 IP 地址和端口；手机与阅读器需在同一局域网。</small><label>外部 HTTPS<input id='external' autocomplete='off'></label><label>家庭 Wi-Fi<input id='wifi' autocomplete='off'></label><label>HA 令牌<input id='token' type='password' autocomplete='off'></label><label>CF Access Client ID<input id='cfid' autocomplete='off'></label><label>CF Access Client Secret<input id='cfsec' type='password' autocomplete='off'></label><label><input id='en' type='checkbox'>启用</label><label><input id='ex' type='checkbox'>允许外部地址</label><label><input id='exc' type='checkbox'>允许外部控制</label><label><input id='clrt' type='checkbox'>清除 HA 令牌</label><label><input id='clrc' type='checkbox'>清除 Access</label></section><section id='printers' hidden><p>先在家庭连接中配置 Home Assistant；此页仅管理打印机连接，不修改家庭服务设置。</p><div id='pr'></div></section><button id='go' type='button' disabled>保存到设备</button><small>保存表示已写入设备。连接结果以设备同步为准，不表示令牌已通过。家庭连接与打印机分别保存；原直连凭据会保留。</small><script>function key(){var h=location.hash,i=h.indexOf('t=');if(i<0)return '';var t='';for(var k=i+2;k<h.length&&t.length<32;k++){var c=h.charAt(k);if((c>='0'&&c<='9')||(c>='a'&&c<='f'))t+=c;else break;}return t;}function api(m,p,b){var h={'X-Pico-Portal-Key':key()};var o={method:m,headers:h};if(b){h['Content-Type']='application/json';o.body=JSON.stringify(b);}return fetch(p,o).then(function(r){return r.json().then(function(j){j._status=r.status;return j;});});}function field(parent,id,label,value,secret){var l=document.createElement('label');l.textContent=label;var i=document.createElement('input');i.id=id;i.value=value||'';if(secret)i.type='password';l.appendChild(i);parent.appendChild(l);}var printerMode=new URLSearchParams(location.hash.slice(1)).get('p')==='1';document.getElementById('home').hidden=printerMode;document.getElementById('printers').hidden=!printerMode;document.getElementById('title').textContent=printerMode?'3D 打印机':'家庭连接';var slots=[],saving=false,loaded=false,searching=false;
function discoveryResults(d){var box=document.getElementById('discoveryResults');box.textContent='';var found=d.servers||[];for(var i=0;i<found.length;i++){(function(server){var b=document.createElement('button');b.type='button';b.textContent=(server.name||'Home Assistant')+' · '+server.url;b.onclick=function(){document.getElementById('local').value=server.url;document.getElementById('discoveryStatus').textContent='地址已填入，请填写令牌并保存。';};box.appendChild(b);})(found[i]);}document.getElementById('discoveryStatus').textContent=d.busy?'正在搜索…':d.failed?'搜索未完成，请重试或手动填写地址。':found.length?'请选择服务器（尚未保存）':'未发现服务。请确认同一局域网，或手动填写 IP 地址和端口。';}
function discover(){if(searching)return;searching=true;var button=document.getElementById('discover');button.disabled=true;document.getElementById('discoveryResults').textContent='';document.getElementById('discoveryStatus').textContent='正在搜索…';var attempts=0;function poll(d){if(d.error||d._status>=400)throw Error(d.error==='offline'?'阅读器未连接 Wi-Fi':d.error);discoveryResults(d);if(d.busy&&attempts++<12)return new Promise(function(resolve){setTimeout(resolve,500);}).then(function(){return api('GET','/api/lan/home/discover');}).then(poll);if(d.busy)throw Error('搜索超时，请重试');}api('POST','/api/lan/home/discover').then(poll).catch(function(e){document.getElementById('discoveryStatus').textContent='搜索失败：'+e.message;}).then(function(){searching=false;button.disabled=false;});}
function draw(list){var box=document.getElementById('pr');box.textContent='';slots=list||[];for(var i=0;i<slots.length;i++){var p=slots[i],src=p.source||0,block=document.createElement('div');if(src>1){var note=document.createElement('p');note.textContent='槽 '+(i+1)+' 已有非 HA 来源，本页不改其凭据。';block.appendChild(note);var c=document.createElement('input');c.type='checkbox';c.id='clr'+i;var lab=document.createElement('label');lab.textContent='清除该槽';lab.insertBefore(c,lab.firstChild);block.appendChild(lab);}else{var t=document.createElement('p');t.textContent='槽 '+(i+1)+'（HA 实体前缀）';block.appendChild(t);field(block,'n'+i,'名称',p.name,false);field(block,'e'+i,'实体前缀',p.serial,false);}box.appendChild(block);}}function load(){var s=document.getElementById('s');if(key().length!=32){s.textContent='二维码缺少密钥，请在设备上重新打开';return;}api('GET','/api/lan/home').then(function(h){if(h.error)throw new Error(h.error);var c=h.config||{};document.getElementById('local').value=c.local||'';document.getElementById('external').value=c.external||'';document.getElementById('wifi').value=c.home_wifi||h.current_wifi||'';document.getElementById('en').checked=!!c.enabled;document.getElementById('ex').checked=!!c.external_enabled;document.getElementById('exc').checked=!!c.external_control;if(c.has_token)document.getElementById('token').placeholder='已保存';if(c.has_cf_access_client_id)document.getElementById('cfid').placeholder='已保存';if(c.has_cf_access_client_secret)document.getElementById('cfsec').placeholder='已保存';return printerMode?api('GET','/api/lan/printers'):{printers:[]};}).then(function(p){if(!p||p.error)throw new Error((p&&p.error)||'printers');if(printerMode)draw(p.printers);loaded=true;document.getElementById('go').disabled=false;document.getElementById('s').textContent='可填写后保存';}).catch(function(e){s.textContent='读取失败：'+e.message;});}function save(){if(saving||!loaded)return;var s=document.getElementById('s'),go=document.getElementById('go'),jobs=[];for(var i=0;printerMode&&i<slots.length;i++){var src=slots[i].source||0;if(src>1){var c=document.getElementById('clr'+i);if(c&&c.checked)jobs.push({slot:i,body:{source:0}});continue;}var name=document.getElementById('n'+i).value,serial=document.getElementById('e'+i).value,srcOut=(name||serial)?1:0,b={source:srcOut};if(srcOut===1&&(!serial||serial.length>63||!/^[a-zA-Z0-9_.-]+$/.test(serial))){s.textContent='请填写槽 '+(i+1)+' 的有效 HA 实体前缀，再保存。';return;}if(srcOut){b.name=name;b.serial=serial;}jobs.push({slot:i,body:b});}var body={enabled:document.getElementById('en').checked,external_enabled:document.getElementById('ex').checked,external_control:document.getElementById('exc').checked,local:document.getElementById('local').value,external:document.getElementById('external').value,home_wifi:document.getElementById('wifi').value};var token=document.getElementById('token').value,id=document.getElementById('cfid').value,sec=document.getElementById('cfsec').value;if(token)body.ha_token=token;if(id)body.cf_access_client_id=id;if(sec)body.cf_access_client_secret=sec;var clear=[];if(document.getElementById('clrt').checked)clear.push('ha_token');if(document.getElementById('clrc').checked){clear.push('cf_access_client_id');clear.push('cf_access_client_secret');}if(clear.length)body.clear=clear;saving=true;go.disabled=true;s.textContent='正在保存…';var saved=0;(printerMode?Promise.resolve({ok:true}):api('PUT','/api/lan/home',body)).then(function(h){if(h.error||h._status>=400)throw new Error(h.error||('HTTP '+h._status));if(!printerMode)saved++;var chain=Promise.resolve(h);for(var j=0;j<jobs.length;j++){(function(job){chain=chain.then(function(){return api('PUT','/api/lan/printers?slot='+job.slot,job.body).then(function(r){if(r.error||r._status>=400)throw new Error(r.error||'printer');saved++;return r;});});})(jobs[j]);}return chain;}).then(function(last){document.getElementById('token').value='';document.getElementById('cfid').value='';document.getElementById('cfsec').value='';document.getElementById('clrt').checked=false;document.getElementById('clrc').checked=false;s.textContent='已写入设备，请返回设备查看同步结果。';}).catch(function(e){s.textContent=(saved?'部分设置已保存；其余保存失败，请检查后重试：':'保存失败：')+e.message;}).then(function(){saving=false;go.disabled=false;});}document.getElementById('go').onclick=save;document.getElementById('discover').onclick=discover;load();</script></body></html>
